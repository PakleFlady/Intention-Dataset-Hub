schema_version: '0.1'
id: intentqa-iccv2023-no-gpt-test
dataset_id: intentqa
release_id: v1
annotation_version: author-release-unspecified
task: intention_reasoning
original_task_name: context-aware video intent reasoning
target_id: intent_qa
protocol:
  name: ICCV 2023 BERT video-and-text no-GPT test cohort
  source_ids:
  - paper
split:
  name: Original paper test split
  source_ids:
  - paper
sample_selection:
  description: 'Original IntentQA test split: VGT with BERT text representation from Table 2 and four
    cumulative context-model ablations from Table 3; GPT-assisted and text-only rows excluded.'
  source_ids:
  - paper
inputs:
  modalities:
  - rgb
  - text
  representation: Video frame/region features derived from RGB and BERT question-answer representation;
    model-internal feature fusion varies.
  available_information: Full question and video clip at inference; no external GPT answer stage.
temporal:
  observation_window:
    kind: variable
    anchor: entire provided video clip
    description: Clip length varies by example; complete supplied clip is observed.
    unit: seconds
  anticipation_gap:
    kind: not_applicable
    anchor: task target
    description: Retrospective video question answering.
  prediction_horizon:
    kind: not_applicable
    anchor: task target
    description: Reasoning about the depicted event, not forecasting a future time.
training_policy:
  external_data: forbidden
  pretraining: allowed
  extra_supervision: allowed
  source_ids:
  - paper
  notes: BERT and visual backbone pretraining allowed. No external GPT answers at inference; VQL/triplet
    are within-paper training additions.
  ensemble: forbidden
evaluation:
  description: Five-choice IntentQA answer classification; VGT BERT row in Table 2 and no-GPT model variants
    in Table 3.
  aggregation: Overall test accuracy.
  parameters: {}
  source_ids:
  - paper
metrics:
- id: total_accuracy
  name: Total test accuracy
  direction: higher
  unit: percent
  definition: Correct multiple-choice answers over all test questions.
  aggregation: overall
  evaluation_subset: original test split / Total column
  source_ids:
  - paper
  valid_range:
  - 0
  - 100
