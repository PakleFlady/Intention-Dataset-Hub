schema_version: '0.1'
id: intentonomy-author-test-rgb
dataset_id: intentonomy
release_id: v1
annotation_version: author-release-unspecified
task: intention_recognition
original_task_name: Intentonomy intent classification
target_id: intent_category
protocol:
  name: Author repository test-set RGB baseline cohort
  source_ids:
  - author_readme
split:
  name: Author repository test set
  source_ids:
  - author_readme
sample_selection:
  description: Use the three baseline rows listed under Test set results in the author README; this record
    includes two RGB-inference rows and excludes the hashtag-input row.
  source_ids:
  - author_readme
inputs:
  modalities:
  - rgb
  representation: Image RGB at inference; second configuration adds training localization loss.
  available_information: Whole image; no text or hashtag supplied at inference for included rows.
temporal:
  observation_window:
    kind: not_applicable
    anchor: task target
    description: Still-image task.
  anticipation_gap:
    kind: not_applicable
    anchor: task target
    description: Static image classification.
  prediction_horizon:
    kind: not_applicable
    anchor: task target
    description: Static image classification.
training_policy:
  external_data: allowed
  pretraining: allowed
  extra_supervision: allowed
  source_ids:
  - author_readme
  notes: Localization masks are used as extra training supervision for L_loc; this is disclosed as a configuration
    difference.
  ensemble: forbidden
evaluation:
  description: Test-set intent category F1 as reported in the author repository.
  aggregation: Reported mean across author runs; accompanying �� spread retained in source.
  parameters: {}
  source_ids:
  - author_readme
metrics:
- id: macro_f1
  name: Macro F1
  direction: higher
  unit: percent
  definition: Unweighted mean of per-class F1 scores.
  aggregation: mean of reported test runs
  evaluation_subset: author test set
  source_ids:
  - author_readme
  valid_range:
  - 0
  - 100
- id: micro_f1
  name: Micro F1
  direction: higher
  unit: percent
  definition: F1 computed from pooled decisions.
  aggregation: mean of reported test runs
  evaluation_subset: author test set
  source_ids:
  - author_readme
  valid_range:
  - 0
  - 100
- id: samples_f1
  name: Samples F1
  direction: higher
  unit: percent
  definition: Mean of F1 computed per image sample.
  aggregation: mean of reported test runs
  evaluation_subset: author test set
  source_ids:
  - author_readme
  valid_range:
  - 0
  - 100
