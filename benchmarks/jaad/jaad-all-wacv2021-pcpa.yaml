schema_version: '0.1'
id: jaad-all-wacv2021-pcpa
dataset_id: jaad
release_id: jaad_2_0
annotation_version: JAAD_2.0
task: behavior_prediction
original_task_name: pedestrian crossing action prediction
target_id: crossing_action
protocol:
  name: WACV 2021 JAAD_all PCPA attention comparison
  source_ids:
  - paper
split:
  name: 'WACV 2021 JAAD_all: 177 train / 29 validation / 117 test video clips'
  source_ids:
  - paper
sample_selection:
  description: 323 high-visibility clips after excluding 23 lower-resolution/adverse-weather/night clips;
    JAAD_all includes additional bystander pedestrians; 0.8 sequence overlap, 16 observed frames and 30�C60-frame
    time-to-event.
  source_ids:
  - paper
inputs:
  modalities:
  - rgb
  - trajectory
  - vehicle_telemetry
  representation: RGB context, pedestrian bounding boxes and qualitative JAAD ego-vehicle speed labels;
    author model also extracts pose from RGB.
  available_information: Only the 16-frame observed pedestrian segment; no post-event frames supplied.
temporal:
  observation_window:
    kind: fixed
    anchor: last observed frame
    description: 16 frames sampled at 30 fps.
    unit: frames
    value: 16
    frame_rate: 30
  anticipation_gap:
    kind: range
    anchor: crossing event start
    description: Sampled time-to-event range of 30�C60 frames for crossing samples.
    unit: frames
    min: 30
    max: 60
    frame_rate: 30
  prediction_horizon:
    kind: not_applicable
    anchor: task target
    description: Binary event label is evaluated over selected time-to-event samples.
training_policy:
  external_data: allowed
  pretraining: allowed
  extra_supervision: allowed
  source_ids:
  - paper
  notes: Within-paper PCPA attention ablations share the author's training/evaluation pipeline.
  ensemble: forbidden
evaluation:
  description: Binary crossing classification on JAAD_all samples.
  aggregation: Overall test statistic in JAAD_all Table 3 column.
  parameters: {}
  source_ids:
  - paper
metrics:
- id: accuracy
  name: Accuracy
  direction: higher
  unit: ratio
  definition: Fraction of correctly classified crossing and non-crossing samples.
  aggregation: overall
  evaluation_subset: JAAD_all
  source_ids:
  - paper
  valid_range:
  - 0
  - 1
- id: auc
  name: AUC
  direction: higher
  unit: ratio
  definition: Area under the ROC curve for crossing prediction.
  aggregation: overall
  evaluation_subset: JAAD_all
  source_ids:
  - paper
  valid_range:
  - 0
  - 1
- id: f1
  name: F1
  direction: higher
  unit: ratio
  definition: Harmonic mean of crossing precision and recall.
  aggregation: overall
  evaluation_subset: JAAD_all
  source_ids:
  - paper
  valid_range:
  - 0
  - 1
sources:
- id: paper
  type: paper
  title: Benchmark for Evaluating Pedestrian Action Prediction
  url: https://openaccess.thecvf.com/content/WACV2021/papers/Kotseruba_Benchmark_for_Evaluating_Pedestrian_Action_Prediction_WACV_2021_paper.pdf
  accessed_at: '2026-09-30'
  locator:
    section: 3 Benchmark; 6 Proposed model
    table: Table 3
verification:
  status: verified
  checked_at: '2026-09-30'
  source_ids:
  - paper
  notes: Original protocol details checked; no independent implementation reproduction.
