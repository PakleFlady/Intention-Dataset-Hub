schema_version: '0.1'
id: assembly101-icip2023-val-multiview
dataset_id: assembly101
release_id: v1
annotation_version: author-release-unspecified
task: action_anticipation
original_task_name: Action anticipation
target_id: future_assembly_action
protocol:
  name: ICIP 2023 Assembly101 validation, all-view fused anticipation
  source_ids: [official_code, goal_paper, goal_code]
  notes: This is the 2023 paper's validation cohort, not the original paper's test table.
split:
  name: Official train.csv to validation_challenge.csv
  source_ids: [official_code, goal_code]
sample_selection:
  description: Fine-grained anticipation annotations; predictions from all fixed and egocentric views of each sequence are average-pooled into one video-level prediction. Overall validation subset.
  source_ids: [official_code, goal_paper]
inputs:
  modalities: [rgb]
  representation: 2048-dimensional per-frame TSM RGB features, using all fixed and egocentric views.
  available_information: Visual features before the next fine-grained action; goal labels are training supervision for goal-branch variants, not future labels supplied at inference.
temporal:
  observation_window:
    kind: variable
    unit: seconds
    anchor: cutoff before next action
    description: Past observations aggregated by TempAgg; the cited cohort does not report one fixed duration for every clip.
  anticipation_gap:
    kind: fixed
    unit: seconds
    value: 1
    anchor: next action onset
    description: Predict the upcoming action one second before it begins.
  prediction_horizon:
    kind: fixed
    unit: actions
    value: 1
    anchor: next annotated fine-grained action
    description: One upcoming verb-object action.
training_policy:
  external_data: allowed
  pretraining: allowed
  extra_supervision: allowed
  ensemble: allowed
  source_ids: [official_code, goal_paper, goal_code]
  notes: All rows use the provided TSM feature route; feature-extractor pretraining is not treated as a closed-data claim. Goal branches may use Assembly101 goal labels during training. All-view score fusion is part of this comparison setting, not a single-view score.
evaluation:
  description: Class-mean top-5 recall on the overall Assembly101 validation set after all-view score averaging.
  aggregation: Mean recall across classes; multi-view scores average-pooled per video.
  parameters: {view_fusion: average_pool_all_views}
  source_ids: [official_code, goal_paper]
metrics:
- id: action_recall_at_5
  name: Action class-mean recall@5
  direction: higher
  unit: percent
  definition: Mean top-five recall across fine-grained verb-object action classes.
  aggregation: class mean after all-view score averaging
  evaluation_subset: overall validation
  valid_range: [0, 100]
  top_k: 5
  label_space: fine-grained action
  source_ids: [goal_paper, official_code]
- id: object_recall_at_5
  name: Object class-mean recall@5
  direction: higher
  unit: percent
  definition: Mean top-five recall across anticipated object classes.
  aggregation: class mean after all-view score averaging
  evaluation_subset: overall validation
  valid_range: [0, 100]
  top_k: 5
  label_space: object
  source_ids: [goal_paper, official_code]
- id: verb_recall_at_5
  name: Verb class-mean recall@5
  direction: higher
  unit: percent
  definition: Mean top-five recall across anticipated verb classes.
  aggregation: class mean after all-view score averaging
  evaluation_subset: overall validation
  valid_range: [0, 100]
  top_k: 5
  label_space: verb
  source_ids: [goal_paper, official_code]
sources:
- id: official_code
  type: official_project
  title: Assembly101 author action anticipation code and validation results
  url: https://github.com/assembly-101/assembly101-action-anticipation/tree/main/tempAgg-action-anticipation
  accessed_at: '2026-10-08'
  locator: {section: Evaluate / Validation; Train}
- id: goal_paper
  type: paper
  title: Action Anticipation with Goal Consistency
  url: https://gall.cv-uni-bonn.de/download/jgall_latentanticipation_icip23.pdf
  accessed_at: '2026-10-08'
  locator: {section: '4.3 Results', table: '1'}
- id: goal_code
  type: official_project
  title: Goal Consistency author implementation and Assembly101 instructions
  url: https://github.com/olga-zats/goal_consistency
  accessed_at: '2026-10-08'
  locator: {section: Assembly101}
verification:
  status: verified
  checked_at: '2026-10-08'
  source_ids: [official_code, goal_paper, goal_code]
  notes: Validation split, all-view fusion, TSM features, one-second anticipation and Table 1 multi-view values were checked against the original author materials. No implementation was run.
results:
- id: tempagg_val_mv
  method_id: tempagg
  configuration:
    description: Author TempAgg baseline; all-view fused validation result as repeated in ICIP 2023 Table 1.
    modalities: [rgb]
    external_data: No external training data reported
    pretraining: Assembly101 TSM RGB features
    ensemble: true
    evaluation_parameters: {view_fusion: average_pool_all_views}
  scores:
    action_recall_at_5: {value: 8.53, source_ids: [goal_paper, official_code], locator: {table: '1', row: TempAgg, column: M.V. ACT. Overall}}
    object_recall_at_5: {value: 26.27, source_ids: [goal_paper, official_code], locator: {table: '1', row: TempAgg, column: M.V. NOUN Overall}}
    verb_recall_at_5: {value: 59.11, source_ids: [goal_paper, official_code], locator: {table: '1', row: TempAgg, column: M.V. VERB Overall}}
  source_ids: [goal_paper, official_code]
  protocol_match: {status: confirmed, source_ids: [goal_paper, official_code], locator: {table: '1', row: TempAgg}, notes: Both author sources identify this as overall validation with all-view score averaging.}
  verification: {status: verified, checked_at: '2026-10-08', source_ids: [goal_paper, official_code], notes: Exact Table 1 multi-view cells cross-checked against official baseline validation table.}
  status: active
  baseline_origin: dataset_authors
- id: no_goal_val_mv
  method_id: goal_no_goal
  configuration:
    description: ICIP 2023 retrained TempAgg ablation without a goal branch; batch size 64, all-view fusion.
    modalities: [rgb]
    external_data: No external training data reported
    pretraining: Assembly101 TSM RGB features
    ensemble: true
    evaluation_parameters: {view_fusion: average_pool_all_views}
  scores:
    action_recall_at_5: {value: 9.53, source_ids: [goal_paper], locator: {table: '1', row: No goal, column: M.V. ACT. Overall}}
    object_recall_at_5: {value: 26.94, source_ids: [goal_paper], locator: {table: '1', row: No goal, column: M.V. NOUN Overall}}
    verb_recall_at_5: {value: 59.87, source_ids: [goal_paper], locator: {table: '1', row: No goal, column: M.V. VERB Overall}}
  source_ids: [goal_paper]
  protocol_match: {status: confirmed, source_ids: [goal_paper], locator: {table: '1', row: No goal}, notes: Same multi-view validation cohort; training batch size is a method configuration difference.}
  verification: {status: verified, checked_at: '2026-10-08', source_ids: [goal_paper], notes: Checked Table 1 multi-view cells and implementation description.}
  status: active
  baseline_origin: protocol_authors
- id: one_goal_val_mv
  method_id: goal_one
  configuration:
    description: One Assembly101 goal branch and consistency loss during training; all-view fusion.
    modalities: [rgb]
    external_data: No external training data reported
    pretraining: Assembly101 TSM RGB features
    ensemble: true
    evaluation_parameters: {view_fusion: average_pool_all_views}
  scores:
    action_recall_at_5: {value: 11.29, source_ids: [goal_paper], locator: {table: '1', row: Ours (1 goal), column: M.V. ACT. Overall}}
    object_recall_at_5: {value: 27.66, source_ids: [goal_paper], locator: {table: '1', row: Ours (1 goal), column: M.V. NOUN Overall}}
    verb_recall_at_5: {value: 58.40, source_ids: [goal_paper], locator: {table: '1', row: Ours (1 goal), column: M.V. VERB Overall}}
  source_ids: [goal_paper, goal_code]
  protocol_match: {status: confirmed, source_ids: [goal_paper, goal_code], locator: {table: '1', row: Ours (1 goal)}, notes: Table 1 M.V. cohort and author fixed+ego evaluation command match.}
  verification: {status: verified, checked_at: '2026-10-08', source_ids: [goal_paper, goal_code], notes: Checked Table 1 multi-view cells and author code configuration.}
  status: active
  baseline_origin: protocol_authors
- id: two_goals_val_mv
  method_id: goal_two
  configuration:
    description: Fine and sequence-level goal branches with consistency losses during training; all-view fusion.
    modalities: [rgb]
    external_data: No external training data reported
    pretraining: Assembly101 TSM RGB features
    ensemble: true
    evaluation_parameters: {view_fusion: average_pool_all_views}
  scores:
    action_recall_at_5: {value: 12.07, source_ids: [goal_paper], locator: {table: '1', row: Ours (2 goals), column: M.V. ACT. Overall}}
    object_recall_at_5: {value: 28.38, source_ids: [goal_paper], locator: {table: '1', row: Ours (2 goals), column: M.V. NOUN Overall}}
    verb_recall_at_5: {value: 60.04, source_ids: [goal_paper], locator: {table: '1', row: Ours (2 goals), column: M.V. VERB Overall}}
  source_ids: [goal_paper, goal_code]
  protocol_match: {status: confirmed, source_ids: [goal_paper, goal_code], locator: {table: '1', row: Ours (2 goals)}, notes: Table 1 M.V. cohort and author fixed+ego evaluation command match.}
  verification: {status: verified, checked_at: '2026-10-08', source_ids: [goal_paper, goal_code], notes: Checked Table 1 multi-view cells and author code configuration.}
  status: active
  baseline_origin: protocol_authors
snapshots:
- id: paper_snapshot_2026_10_08
  checked_at: '2026-10-08'
  scope: paper_reported
  source_ids: [goal_paper, goal_code, official_code]
  result_ids: [tempagg_val_mv, no_goal_val_mv, one_goal_val_mv, two_goals_val_mv]
  coverage_notes: Four configurations from ICIP 2023 Table 1 multi-view validation cohort. The official test split and later papers are outside this snapshot; best here is not a current field-wide SOTA claim.
