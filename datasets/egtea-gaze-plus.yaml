schema_version: '0.1'
id: egtea-gaze-plus
name: EGTEA Gaze+
year: 2018
description: First-person food preparation videos with gaze and action annotations used in action anticipation
  research.
intention_relevance: implicit
intention_definition: Anticipate a subsequent manipulation action using past first-person observations;
  the future action is a proxy rather than an explicit goal label.
