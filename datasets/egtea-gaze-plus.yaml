schema_version: '0.1'
id: egtea-gaze-plus
name: EGTEA Gaze+
year: 2018
description: First-person food preparation videos with gaze and action annotations used in action anticipation
  research.
intention_relevance: implicit
intention_definition: Anticipate a subsequent manipulation action using past first-person observations;
  the future action is a proxy rather than an explicit goal label.
domains:
- daily_activities
- human_object_interaction
intention_types:
- object_interaction
tasks:
- action_anticipation
modalities:
- rgb
- audio
- gaze
data_formats:
- video
- time_series
- structured_annotation
data_origin: real
annotations:
- id: action_segment
  semantic: future_action
  description: Later kitchen action segment used in anticipation protocols.
  provenance: behavior_derived
  scope: First-person activity videos
  source_ids: &id001
  - official
  - author_protocol
releases:
- id: v1
  label: EGTEA Gaze+ release documented by original source
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not identified by this source.
