verification:
  status: verified
  checked_at: '2026-11-02'
  source_ids:
  - official
  notes: Checked the original descriptions, annotation meaning, public examples and access statements. Full dataset
    files were not downloaded, and benchmark results have not been curated. On 2026-11-17 the example was matched
    by official annotation ID to a local filename; component license declarations were reviewed separately.
notes: Included because labels represent human social and communicative purposes, rather than service-domain routing
  or slot filling. TV dialogue is scripted/performed and should not be described as unscripted natural behavior.
  The repository's code license must not be assumed to cover television footage. The official cards contain differing
  license declarations; see [media handling and local playback](../media-policy.md). The one-row annotation excerpt
  is attributed to THUIAR/MMLA-Datasets under its declared CC BY 4.0; label whitespace is normalized. External media
  is not covered by this Hub's license.
example:
  kind: source_record
  input: 'Video/audio file MIntRec_S06_E04_70.mp4 with the official transcript: "you''re gonna go back and work
    on that register".'
  output: 'Official fine-grained intent label: arrange. This is an observer-assigned communicative purpose, not
    a direct measurement of the actor''s private intent.'
  source_ids:
  - mmla_annotation
  - mmla_card
  sample_url: https://huggingface.co/datasets/THUIAR/MMLA-Datasets/blob/ff135d32adaac2c3d5b0268e88a7ce6af200f544/MIntRec/test.tsv
  source_locator: MIntRec/test.tsv, first data row; id S06_E04_70. Whitespace around label trimmed for display.
    Matched to the same basename in the local video directory; video bytes were not independently matched to the
    archive publisher.
  checked_at: '2026-11-17'
  media:
    kind: image
    url: https://raw.githubusercontent.com/thuiar/MIntRec/main/figs/example.png
    alt: Official MIntRec task illustration, separate from the identified local record
    caption: General author-published task illustration; NOT a frame from S06_E04_70. See the linked annotation
      and the local playback guide for that record.
