  value: 2224
  unit: utterances
  release_id: original
  scope: Author-described full release
  source_ids:
  - official
- name: Intent categories
  value: 20
  unit: classes
  release_id: original
  scope: Author-described full release
  source_ids:
  - official
related_datasets:
