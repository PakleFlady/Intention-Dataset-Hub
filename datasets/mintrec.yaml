schema_version: '0.1'
id: mintrec
name: MIntRec
year: 2022
description: Observer-labeled communicative purposes in audiovisual TV dialogue, with 20 intent categories covering
  expressed attitudes and interpersonal goals. Labels describe portrayed social interaction, not the actors' private
  intentions.
intention_relevance: explicit
intention_definition: Observer-labeled communicative purposes in audiovisual TV dialogue, with 20 intent categories
  covering expressed attitudes and interpersonal goals. Labels describe portrayed social interaction, not the actors'
  private intentions.
domains:
- social_interaction
intention_types:
- communicative
tasks:
- intention_recognition
modalities:
- rgb
- audio
- text
data_formats:
- video
- text
- structured_annotation
data_origin: real
annotations:
- id: intention
  semantic: intention
  description: One of 20 fine-grained communicative-intent classes per utterance. Five annotators vote; retained
    samples have at least three agreeing votes.
  provenance: observer_judgment
  scope: Author-described dataset release
  source_ids:
  - official
releases:
- id: original
  label: Original author-described release
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: No immutable annotation version was identified; benchmark protocols must resolve the precise files.
access:
  status: open
  url: https://github.com/thuiar/MIntRec
  conditions: Official downloads are available. A local copy was inventoried (2,224 MP4s); no media is mirrored
    by this Hub. Local availability and publisher license metadata do not establish underlying TV-footage redistribution
    rights.
  checked_at: '2026-11-17'
  source_ids:
  - official
  - mmla_card
licenses:
- component: Official repository software
  status: known
  name: MIT
  url: https://github.com/thuiar/MIntRec/blob/6bc239695df342c22c324bb3a76789fa295ff999/LICENSE
  source_ids:
  - code_license
- component: MMLA repack metadata / annotations (publisher declaration)
  status: known
  name: CC BY 4.0 as declared by MMLA; separate MIntRec card declares CC BY-SA 4.0
  url: https://huggingface.co/datasets/THUIAR/MMLA-Datasets/blob/ff135d32adaac2c3d5b0268e88a7ce6af200f544/README.md
  source_ids:
  - mmla_card
  - mintrec_card
- component: 'Underlying Superstore television footage: independent redistribution rights'
  status: unknown
  source_ids:
  - official
  - mmla_card
  - mintrec_card
