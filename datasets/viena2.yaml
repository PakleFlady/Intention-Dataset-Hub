schema_version: '0.1'
id: viena2
name: VIENA2
year: 2018
description: Virtual driving scenarios designed for action anticipation.
intention_relevance: implicit
intention_definition: Predict simulated future actions in driver, pedestrian and front-car scenarios;
  class labels encode future behavior rather than directly observed private intention.
domains:
- driver_behavior
- pedestrian
- autonomous_driving
intention_types:
- driving_maneuver
- pedestrian_crossing
- action
tasks:
- action_anticipation
- behavior_prediction
modalities:
- rgb
- vehicle_telemetry
data_formats:
- video
- time_series
- structured_annotation
data_origin: synthetic
annotations:
- id: scenario_action
  semantic: future_action
  description: Scenario-specific future action labels generated with simulated recordings.
  provenance: simulated
  scope: Five scenario families
  source_ids:
  - official
releases:
- id: paper_release
  label: 'VIENA2: author-described data'
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not established; downstream protocols require separate mapping.
