schema_version: '0.1'
id: ego4d
name: Ego4D
year: 2021
description: Large first-person video collection with short- and long-term forecasting tasks.
intention_relevance: implicit
intention_definition: Predict future camera-wearer actions and object interactions from prior first-person
  observations; these future events are intention proxies.
domains:
- daily_activities
- human_object_interaction
intention_types:
- action
- object_interaction
tasks:
- action_anticipation
- future_activity_prediction
- trajectory_prediction
- human_object_interaction_prediction
modalities:
- rgb
- audio
- trajectory
- object_state
data_formats:
- video
- time_series
- structured_annotation
data_origin: real
annotations:
- id: future_action_sequence
