schema_version: '0.1'
id: ego4d
name: Ego4D
year: 2021
description: Large first-person video collection with short- and long-term forecasting tasks.
intention_relevance: implicit
intention_definition: Predict future camera-wearer actions and object interactions from prior first-person
  observations; these future events are intention proxies.
domains:
- daily_activities
- human_object_interaction
intention_types:
- action
- object_interaction
tasks:
- action_anticipation
- future_activity_prediction
- trajectory_prediction
- human_object_interaction_prediction
modalities:
- rgb
- audio
- trajectory
- object_state
data_formats:
- video
- time_series
- structured_annotation
data_origin: real
annotations:
- id: future_action_sequence
  semantic: future_action
  description: Sequence of later wearer verb-noun actions in the long-term anticipation task.
  provenance: behavior_derived
  scope: Forecasting benchmark clips
  source_ids: &id001
  - official
releases:
- id: v1
  label: Ego4D release documented by original source
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not identified by this source.
access:
  status: registration
  url: https://ego4d-data.org/docs/benchmarks/forecasting/
  checked_at: '2026-09-30'
  source_ids:
  - official
  conditions: See the source for current download conditions; raw files were not downloaded for this
    catalog.
licenses:
- component: dataset media and annotations
  status: unknown
  source_ids:
  - official
sources:
- id: official
  type: official_project
  title: Ego4D original project or publication
  url: https://ego4d-data.org/docs/benchmarks/forecasting/
  accessed_at: '2026-09-30'
  locator:
    section: Task Definition; Annotations
- id: example_source
  type: paper
  title: Ego4D author-published example
  url: https://www.cs.utexas.edu/~grauman/papers/ego4d-cvpr2022.pdf
  accessed_at: '2026-10-09'
  locator:
    section: Ego4D paper, Figure 10, Long-Term Anticipation panel.
verification:
  status: verified
  checked_at: '2026-09-30'
  source_ids: *id001
  notes: Core scope, annotation meaning, and access entry were checked against the linked original resources;
    dataset files were not downloaded.
viewpoints:
- egocentric
capture_setup:
- wearable

example:
  kind: source_figure
  input: The observed egocentric food-preparation frames before the future actions shown in the paper's forecasting
    figure.
  output: The author figure depicts the model prediction 'knead dough + put dough + pack spice + pour spice' (future
    verb-noun actions), not a transcribed ground-truth row.
  source_ids:
  - example_source
  sample_url: https://www.cs.utexas.edu/~grauman/papers/ego4d-cvpr2022.pdf
  source_locator: Ego4D paper, Figure 10, Long-Term Anticipation panel.
  media:
    kind: image
    url: https://ego4d-data.org/assets/images/forecasting.png
    alt: Official Ego4D forecasting illustration of egocentric observations and future activity
    caption: Author-published forecasting illustration; task-specific input and output details are in the linked
      protocol.
  checked_at: '2026-10-09'
