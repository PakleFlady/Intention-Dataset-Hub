notes: Includes social communicative purposes, so it falls within the language-task inclusion boundary. Annotation
  generation is recorded separately from the origin of the audiovisual observations. Dataset license and downloadable
  release remain unresolved.
example:
  kind: source_figure
  input: The official irony demo combines the utterance 'not an edible arrangement' with a humorous costume and
    supportive vocal delivery.
  output: The author's demo identifies emotion Happy and intent Consoling, with an explanation that humor softens
    criticism and comforts the listener.
  source_ids:
  - official
  sample_url: https://github.com/OrangeYeah1027/JX4MEI#-demo
  source_locator: README, Demo and Analysis; docs/images/demo.png.
