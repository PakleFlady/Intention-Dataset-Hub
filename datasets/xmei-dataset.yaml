schema_version: '0.1'
id: xmei-dataset
name: XMEI-dataset
year: 2026
description: Multimodal dialogue samples with emotion and communicative-intent labels plus explanations of their
  relationship. Rationales are model-generated and human-refined interpretations, not participants' self-reported
  mental states.
intention_relevance: explicit
intention_definition: Multimodal dialogue samples with emotion and communicative-intent labels plus explanations
  of their relationship. Rationales are model-generated and human-refined interpretations, not participants' self-reported
  mental states.
domains:
- social_interaction
intention_types:
- communicative
tasks:
- intention_recognition
- intention_reasoning
modalities:
- rgb
- audio
- text
data_formats:
- video
- text
- structured_annotation
data_origin: real
annotations:
- id: intention
  semantic: intention
  description: Seven emotion and nine intent categories, with emotion_reason, intent_reason and joint explanation
    fields; generated rationales undergo human refinement.
  provenance: model_generated
  scope: Author-described dataset release
  source_ids:
  - official
  - paper
releases:
- id: original
  label: Original author-described release
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: No immutable annotation version was identified; benchmark protocols must resolve the precise files.
