verification:
  status: verified
  checked_at: '2026-10-08'
  source_ids:
  - official
  - project
  notes: Source descriptions and annotation meaning checked; no data download, reproduction, or independent
    second-pass review.
example:
  kind: illustrative
  input: An egocentric assembly prefix, optionally with depth and gaze in the multimodal extension.
  output: The upcoming action and next active object.
  source_ids:
  - official
  - project
  checked_at: '2026-10-08'
  sample_url: https://github.com/fpv-iplab/MECCANO
  media:
    kind: animated_image
    url: https://raw.githubusercontent.com/fpv-iplab/MECCANO/master/images/MECCANO_Multimodal.gif
    alt: Author MECCANO multimodal assembly example
    caption: Author demonstration of multimodal observations; the future-action output above is illustrative.
viewpoints:
- egocentric
notes: The original 2021 RGB release and later multimodal extension require distinct release mapping for
  benchmarks; listed depth and gaze belong to the extension.
