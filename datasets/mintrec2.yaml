  type: official_project
  title: 'Official project: dataset, annotation, access and examples'
  url: https://github.com/thuiar/MIntRec2.0
  accessed_at: '2026-11-02'
  locator:
    section: 'Official project: dataset, annotation, access and examples'
- id: release
  type: official_data
  title: 'Zenodo release v3: data files and license'
  url: https://zenodo.org/records/8041676
  accessed_at: '2026-11-02'
  locator:
    section: 'Zenodo release v3: data files and license'
verification:
  status: verified
  checked_at: '2026-11-02'
  source_ids:
  - official
  notes: Checked the original descriptions, annotation meaning, public examples and access statements. Full dataset
    files were not downloaded, and benchmark results have not been curated.
notes: 'Included because labels represent human social and communicative purposes, rather than service-domain routing
  or slot filling. TV dialogue is scripted/performed and should not be described as unscripted natural behavior.
  Distinct from MIntRec: new taxonomy, dialogue context, speakers and out-of-scope data.'
example:
  kind: source_format
  input: An utterance's text, audio and speaker video within an ordered multi-party dialogue, with speaker identity.
  output: One of 30 intent labels (including Comfort and Ask for help) or the out-of-scope category; the official
    example image below shows labeled dialogue turns.
  source_ids:
  - official
  sample_url: https://github.com/thuiar/MIntRec2.0
  source_locator: README, Example, Dataset Description and Benchmark Framework.
  media:
    kind: image
    url: https://raw.githubusercontent.com/thuiar/MIntRec2.0/master/figs/example.png
    alt: Official MIntRec2.0 multimodal dialogue and intent example
    caption: Author-published preview. Refer to the linked original example for its labels and context.
  checked_at: '2026-11-02'
