schema_version: '0.1'
id: mintrec2
name: MIntRec2.0
year: 2024
description: Observer-labeled communicative purposes in audiovisual TV dialogue, with 30 intent categories covering
  expressed attitudes and interpersonal goals. Labels describe portrayed social interaction, not the actors' private
  intentions.
intention_relevance: explicit
intention_definition: Observer-labeled communicative purposes in audiovisual TV dialogue, with 30 intent categories
  covering expressed attitudes and interpersonal goals. Labels describe portrayed social interaction, not the actors'
  private intentions.
domains:
- social_interaction
intention_types:
- communicative
tasks:
- intention_recognition
modalities:
- rgb
- audio
- text
data_formats:
- video
- text
- structured_annotation
data_origin: real
annotations:
- id: intention
  semantic: intention
  description: One of 30 fine-grained communicative-intent classes per utterance. Includes speaker identity, multi-turn
    context and an out-of-scope tag.
  provenance: observer_judgment
  scope: Author-described dataset release
  source_ids:
  - official
releases:
- id: original
  label: Original author-described release
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: No immutable annotation version was identified; benchmark protocols must resolve the precise files.
access:
  status: open
  url: https://github.com/thuiar/MIntRec2.0
  conditions: Official README links Google Drive downloads for annotations, audiovisual features and raw clips.
    Full archives were not downloaded; source TV-media rights remain with their owners.
  checked_at: '2026-11-02'
  source_ids:
  - official
licenses:
- component: released dataset annotations and features
  status: known
  name: CC BY-NC-SA 4.0
  url: https://zenodo.org/records/8041676
  source_ids:
  - release
- component: underlying television footage
  status: unknown
  source_ids:
  - official
sources:
