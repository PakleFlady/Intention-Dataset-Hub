schema_version: '0.1'
id: intentonomy
name: Intentonomy
year: 2021
description: Images of everyday scenes manually assigned human-intent categories.
intention_relevance: explicit
intention_definition: Classify the observer-attributed communicative or social motive conveyed by a
  social-media image; the label does not directly report the uploader's private mental state.
domains:
- daily_activities
- social_interaction
intention_types:
- communicative
- social
tasks:
- intention_recognition
modalities:
- rgb
data_formats:
- image
- structured_annotation
data_origin: real
annotations:
- id: intent_category
  semantic: intention
  description: One of 28 manually assigned categories of image-level human motive.
  provenance: observer_judgment
  scope: Dataset images
  source_ids:
  - official
releases:
- id: v1
  label: Intentonomy release documented by original source
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not identified by this source.
