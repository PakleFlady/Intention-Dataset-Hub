schema_version: '0.1'
id: intentonomy
name: Intentonomy
year: 2021
description: Images of everyday scenes manually assigned human-intent categories.
intention_relevance: explicit
intention_definition: Classify the observer-attributed communicative or social motive conveyed by a
  social-media image; the label does not directly report the uploader's private mental state.
domains:
- daily_activities
- social_interaction
intention_types:
- communicative
- social
tasks:
- intention_recognition
modalities:
- rgb
data_formats:
- image
- structured_annotation
data_origin: real
annotations:
- id: intent_category
  semantic: intention
  description: One of 28 manually assigned categories of image-level human motive.
  provenance: observer_judgment
  scope: Dataset images
  source_ids:
  - official
releases:
- id: v1
  label: Intentonomy release documented by original source
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not identified by this source.
access:
  status: open
  url: https://github.com/KMnP/intentonomy
  checked_at: '2026-09-30'
  source_ids:
  - official
  conditions: See the source for current download conditions; raw files were not downloaded for this
    catalog.
licenses:
- component: dataset media and annotations
  status: unknown
  source_ids:
  - official
sources:
- id: official
  type: official_project
  title: Intentonomy original project or publication
  url: https://github.com/KMnP/intentonomy
  accessed_at: '2026-09-30'
  locator:
    section: Intentonomy Dataset
- id: example_source
  type: paper
  title: Intentonomy author-published example
  url: https://vision.cornell.edu/se3/wp-content/uploads/2021/03/intentonomy.pdf
  accessed_at: '2026-10-09'
  locator:
    section: Intentonomy paper, Figure 1(b), holding-hands image.
verification:
  status: verified
  checked_at: '2026-09-30'
  source_ids:
  - official
  notes: Core scope, annotation meaning, and access entry were checked against the linked original resources;
    dataset files were not downloaded.
viewpoints:
- exocentric
statistics:
- name: images
  value: 14000
  unit: approximately images
  release_id: v1
  scope: official rounded total
  source_ids:
  - official

example:
  kind: source_figure
  input: The social-media image of people holding hands in the author's Figure 1(b).
  output: The figure associates the image with the human-assigned category 'in love'. This is an interpretation
    of image-posting intent, not direct access to the photographed people's mental states.
  source_ids:
  - example_source
  sample_url: https://vision.cornell.edu/se3/wp-content/uploads/2021/03/intentonomy.pdf
  source_locator: Intentonomy paper, Figure 1(b), holding-hands image.
  media:
    kind: image
    url: https://raw.githubusercontent.com/KMnP/intentonomy/master/images/teaser.png
    alt: Official Intentonomy teaser with example images and intent categories
    caption: Author-published teaser of the image-intent task; it does not establish the private motives of the
      people pictured.
  checked_at: '2026-10-09'
