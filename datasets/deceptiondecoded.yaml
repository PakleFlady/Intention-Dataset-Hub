schema_version: '0.1'
id: deceptiondecoded
name: DeceptionDecoded
year: 2025
description: Image-caption news pairs with reference articles and simulated creator desires and editing plans. Intent-guided
  generation supplies misleadingness targets; these are constructed communicative intentions, not measurements of
  real journalists' motives.
intention_relevance: explicit
