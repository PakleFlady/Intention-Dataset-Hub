schema_version: '0.1'
id: loki-traffic
name: 'LOKI: Long Term and Key Intentions'
year: 2021
description: Traffic-agent trajectories with labeled key intentions for pedestrians and vehicles.
intention_relevance: explicit
intention_definition: Model annotated intended actions and potential destinations of pedestrians and vehicles
  alongside their trajectories; these are observer-assigned traffic-agent labels, not agent self-reports
  or direct access to mental state.
domains:
- pedestrian
- autonomous_driving
intention_types:
- driving_maneuver
- pedestrian_crossing
tasks:
- intention_prediction
- trajectory_prediction
modalities:
- rgb
- trajectory
- object_state
- lidar
data_formats:
- video
- time_series
- structured_annotation
data_origin: real
annotations:
- id: key_intention
  semantic: intention
  description: Frame-wise intended actions and potential destinations for heterogeneous traffic agents,
    distinct from current motion and road context.
  provenance: observer_judgment
  scope: Pedestrian and vehicle tracks
  source_ids:
  - official
  - paper
