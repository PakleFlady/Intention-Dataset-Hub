schema_version: '0.1'
id: fifty-salads
name: 50 Salads
year: 2013
description: Synchronized food-preparation video and accelerometer data reused for future procedure prediction.
intention_relevance: implicit
intention_definition: Predict an upcoming recipe action from an observed prefix in PAR-VLA; original activity
  intervals describe behavior rather than intention.
domains:
- daily_activities
- human_object_interaction
intention_types:
- action
- task_goal
tasks:
- action_anticipation
modalities:
- rgb
- depth
- imu
