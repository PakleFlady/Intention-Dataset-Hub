- video
- time_series
- structured_annotation
data_origin: real
annotations:
- id: recipe_activity
  semantic: future_action
  description: Recipe step intervals and phases supply action targets; PAR-VLA selects subsequent labels
    for anticipation.
  provenance: observer_judgment
  scope: Food preparation sequences
  source_ids:
  - official
  - anticipation_paper
