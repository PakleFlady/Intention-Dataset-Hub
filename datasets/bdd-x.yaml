schema_version: '0.1'
id: bdd-x
name: BDD-X
year: 2018
description: Driving videos with textual descriptions and explanations of human driver actions.
intention_relevance: explicit
intention_definition: Observer-authored explanations attribute reasons to observed human driver behavior.
  They provide motive judgments rather than driver self-reports or prospective intentions.
domains:
- driver_behavior
- autonomous_driving
intention_types:
- driving_maneuver
tasks:
- intention_reasoning
modalities:
- rgb
- text
- vehicle_telemetry
- trajectory
data_formats:
- video
- text
- time_series
- structured_annotation
data_origin: real
annotations:
- id: action_explanation
  semantic: explanation
  description: Temporally localized descriptions of what the driver does and why.
  provenance: observer_judgment
  scope: Annotated driving intervals
  source_ids:
  - official
releases:
- id: paper_release
  label: 'BDD-X: author-described data'
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not established; downstream protocols require separate mapping.
