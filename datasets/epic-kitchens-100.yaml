schema_version: '0.1'
id: epic-kitchens-100
name: EPIC-KITCHENS-100
year: 2020
description: Unscripted first-person kitchen recordings with action segments and an official anticipation
  challenge.
intention_relevance: implicit
intention_definition: Anticipate the camera wearer's next kitchen action before its annotated start;
  future action labels serve as a behavioral proxy, not a direct intention report.
domains:
- daily_activities
- human_object_interaction
intention_types:
- object_interaction
tasks:
- action_anticipation
modalities:
- rgb
- audio
- optical_flow
- object_state
data_formats:
- video
- structured_annotation
data_origin: real
annotations:
- id: next_action
  semantic: future_action
  description: Verb and noun action segment occurring after the observation interval.
  provenance: behavior_derived
  scope: Official action anticipation splits
  source_ids: &id001
  - official
releases:
- id: v100
  label: EPIC-KITCHENS-100 release documented by original source
  annotation_version: official-2020
  source_ids:
  - official
  notes: Official EK-100 release.
access:
  status: registration
  url: https://github.com/epic-kitchens/epic-kitchens-100-annotations
  checked_at: '2026-09-30'
  source_ids:
  - official
  conditions: See the source for current download conditions; raw files were not downloaded for this
    catalog.
licenses:
- component: dataset media and annotations
  status: unknown
  source_ids:
  - official
sources:
- id: official
  type: official_project
  title: EPIC-KITCHENS-100 original project or publication
  url: https://github.com/epic-kitchens/epic-kitchens-100-annotations
  accessed_at: '2026-09-30'
  locator:
    section: Action Anticipation Challenge
- id: example_source
  type: official_documentation
  title: EPIC-KITCHENS-100 author-published example
  url: https://github.com/epic-kitchens/epic-kitchens-100-annotations/blob/master/README.md#epic_100_traincsv
  accessed_at: '2026-10-09'
  locator:
    section: Official annotations README, EPIC_100_train.csv column-example table, narration_id P01_01_0.
verification:
  status: verified
