example:
  kind: source_format
  input: The official EPIC_100_train.csv format example identifies video P01_01 and an annotated action from 00:00:00.14
    to 00:00:03.37.
  output: Narration 'open door', parsed as verb 'open' and noun 'door'. Because the action begins at 0.14 s, this
    row illustrates the annotation format, not a valid 5-second anticipation input window.
  source_ids:
  - example_source
  sample_url: https://github.com/epic-kitchens/epic-kitchens-100-annotations/blob/master/README.md#epic_100_traincsv
