schema_version: '0.1'
id: epic-kitchens-100
name: EPIC-KITCHENS-100
year: 2020
description: Unscripted first-person kitchen recordings with action segments and an official anticipation
  challenge.
intention_relevance: implicit
intention_definition: Anticipate the camera wearer's next kitchen action before its annotated start; future
  action labels serve as a behavioral proxy, not a direct intention report.
