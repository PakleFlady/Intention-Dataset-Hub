- object_state
data_formats:
- video
- structured_annotation
data_origin: real
annotations:
- id: next_action
  semantic: future_action
  description: Verb and noun action segment occurring after the observation interval.
  provenance: behavior_derived
  scope: Official action anticipation splits
  source_ids:
  - official
