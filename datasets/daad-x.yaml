schema_version: '0.1'
id: daad-x
name: DAAD-X
year: 2025
description: Explainable driver maneuver data extending DAAD with gaze-aligned and vehicle-context explanations.
intention_relevance: explicit
intention_definition: Observed future maneuvers proxy driver intention; human-authored gaze and ego explanations
  express attributed reasons, not driver self-reports.
domains:
- driver_behavior
intention_types:
- driving_maneuver
tasks:
- action_anticipation
- intention_reasoning
modalities:
- rgb
- gaze
- text
data_formats:
- video
- text
- structured_annotation
data_origin: real
annotations:
- id: maneuver
  semantic: future_action
  description: Seven maneuver labels including straight, stop, turns, lane changes and U-turn.
  provenance: behavior_derived
  scope: Maneuver clips
  source_ids:
  - paper
  - code
- id: ego_explanation
  semantic: explanation
  description: Seventeen ego-vehicle explanation categories; multi-label.
  provenance: observer_judgment
  scope: Gaze-aligned selected clips
  source_ids:
  - paper
- id: gaze_explanation
  semantic: explanation
  description: Fifteen gaze explanation categories; single-label.
  provenance: observer_judgment
  scope: Gaze-aligned selected clips
  source_ids:
  - paper
releases:
- id: paper_release
  label: 'DAAD-X: author-described data'
  annotation_version: author-release-unspecified
  source_ids:
  - data
  - code
  - paper
  notes: Exact annotation revision is not established; downstream protocols require separate mapping.
