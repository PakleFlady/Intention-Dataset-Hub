name: STEP block assembly study data (extended annotations)
year: 2026
description: Task and state annotations added to human-teleoperated simulated block assembly sequences.
intention_relevance: explicit
intention_definition: The manually labeled final block structure represents the human operator task goal;
  simulated robot plans are assistance outputs rather than autonomous-agent intentions.
