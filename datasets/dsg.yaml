schema_version: '0.1'
id: dsg
name: DSG (Dynamic Scene Graph intention dataset)
year: 2025
description: Scene-graph intention data constructed from selected Action Genome videos.
intention_relevance: explicit
intention_definition: Intention classes are extracted from scripts describing an action beginning; they
  are behavior-derived operational labels, not reported mental states.
domains:
- daily_activities
- human_object_interaction
intention_types:
- action
- object_interaction
tasks:
- intention_recognition
modalities:
- rgb
- text
- object_state
data_formats:
- video
- text
- structured_annotation
data_origin: real
annotations:
- id: script_intention
  semantic: intention
  description: Action-beginning gerund extracted from the video script.
  provenance: behavior_derived
  scope: Selected videos
  source_ids:
  - paper
  - code
- id: scene_relationship
  semantic: cue
  description: Object relationships produced by the scene-graph model.
  provenance: model_generated
  scope: Sampled frames
  source_ids:
  - paper
  - code
releases:
- id: paper_release
  label: 'DSG (Dynamic Scene Graph intention dataset): author-described data'
  annotation_version: author-release-unspecified
  source_ids:
  - code
  - paper
  notes: Exact annotation revision is not established; downstream protocols require separate mapping.
access:
  status: open
  url: https://github.com/Tong0720/STGAIN
  checked_at: '2026-10-08'
  source_ids:
  - code
  - paper
  conditions: Graph and script CSVs are public in the author repository. Completeness and label mapping
    to the paper corpus are not confirmed; source video reconstruction requires Action Genome.
licenses:
- component: dataset media and annotations
  status: unknown
  source_ids:
  - code
sources:
- id: code
  type: author_code
  title: STGAIN author repository
  url: https://github.com/Tong0720/STGAIN
  accessed_at: '2026-10-08'
  locator:
    section: Action Genome Setup; Train and Evaluation
    file: Dataloader/script.csv; Dataloader/dataset.csv; Dataloader/dataset1.csv
- id: paper
  type: paper
  title: Human intention recognition using context relationships in complex scenes
  url: https://orca.cardiff.ac.uk/174841/1/1-s2.0-S0957417424030148-main.pdf
  accessed_at: '2026-10-08'
  locator:
    section: 3.1-3.3 Dataset construction
    page: 3-6
verification:
  status: verified
  checked_at: '2026-10-08'
  source_ids:
  - code
  - paper
  notes: Source descriptions and annotation meaning checked; no data download, reproduction, or independent
    second-pass review.
example:
  kind: illustrative
  input: Observed person-object relationships and the context preceding a scripted action.
  output: An action-intention category, such as dressing or tidying.
  source_ids:
  - code
  - paper
  checked_at: '2026-10-08'
  sample_url: https://github.com/Tong0720/STGAIN
related_datasets:
- action-genome
code_url: https://github.com/Tong0720/STGAIN
statistics:
