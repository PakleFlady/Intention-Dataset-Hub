schema_version: '0.1'
id: jaad
name: JAAD
year: 2017
description: Joint Attention in Autonomous Driving video and pedestrian behavior annotations.
intention_relevance: implicit
intention_definition: Predict a pedestrian's future crossing behavior from preceding observations; a later
  crossing action is not a direct report of the pedestrian's mental intention.
domains:
- pedestrian
- autonomous_driving
intention_types:
- pedestrian_crossing
tasks:
- behavior_prediction
- trajectory_prediction
modalities:
- rgb
- trajectory
- vehicle_telemetry
data_formats:
- video
- time_series
- structured_annotation
data_origin: real
annotations:
- id: crossing_action
  semantic: future_action
  description: Pedestrian crossing behavior used to construct crossing sequences.
  provenance: behavior_derived
  scope: JAAD_beh crossing tracks and JAAD_all additional non-crossing visible pedestrians under the WACV
    2021 sampling protocol.
  source_ids:
  - official
  - wacv_protocol
