schema_version: '0.1'
id: intentqa
name: IntentQA
year: 2023
description: Video question answering dataset focused on latent human intentions and reasons for actions.
intention_relevance: explicit
intention_definition: Answer observer-authored questions about why a person acts and which latent intention
  is suggested by video context; answers are judgments, not subject self-reports.
domains:
- daily_activities
- social_interaction
intention_types:
- goal
- social
tasks:
- intention_reasoning
modalities:
- rgb
- text
data_formats:
- video
- text
- structured_annotation
data_origin: real
annotations:
- id: intent_qa
  semantic: explanation
  description: Question-answer judgments about latent goals and intentions behind visible actions.
  provenance: observer_judgment
  scope: Video question-answer pairs
  source_ids:
  - official
releases:
- id: v1
  label: IntentQA release documented by original source
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not identified by this source.
access:
  status: open
  url: https://github.com/JoseponLee/IntentQA
  checked_at: '2026-09-30'
  source_ids:
  - official
  conditions: See the source for current download conditions; raw files were not downloaded for this catalog.
licenses:
- component: dataset media and annotations
  status: unknown
  source_ids:
  - official
sources:
- id: official
  type: official_project
  title: IntentQA original project or publication
  url: https://github.com/JoseponLee/IntentQA
  accessed_at: '2026-09-30'
  locator:
    section: Introduction; Dataset
- id: intentvlm_2026
  type: paper
  title: 'IntentVLM: Open-Vocabulary Intention Recognition from Videos via Multimodal Large Language Models'
  url: https://arxiv.org/abs/2604.24002
  accessed_at: '2026-10-08'
  locator:
    section: Experiments; IntentQA evaluation
verification:
  status: verified
  checked_at: '2026-09-30'
  source_ids:
  - official
  notes: Core scope, annotation meaning, and access entry were checked against the linked original resources;
    dataset files were not downloaded.
viewpoints:
- exocentric
notes: The 2026 TPAMI expansion is a separate annotation revision and needs a distinct release ID when
  benchmarked. IntentVLM (2026) reuses IntentQA for intention evaluation; this is a downstream use, not
  a new native annotation release.
example:
  kind: illustrative
  input: A video clip together with a natural-language question about why a person acted.
  output: A natural-language answer from the question-answer annotation; the answer is an interpretation
    of intent.
  checked_at: '2026-10-08'
  source_ids:
  - official
  sample_url: https://vimeo.com/896083218
