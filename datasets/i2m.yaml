notes: The published benchmark predicts future human motion; goal inference is an intended research use. Scene point
  clouds and meshes are also provided in the described release. The preview image is a separate author example,
  not asserted to be Figure 2's exact frame.
example:
  kind: source_figure
  input: The paired human motion, RGB-D views and scene geometry in the paper's Figure 2, at frame 0 for participant
