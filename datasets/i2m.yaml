schema_version: '0.1'
id: i2m
name: Intend to Move (I2M)
year: 2025
description: Two-person motion captured in staged home environments with time-aligned textual goals. Participants
  follow designed scenarios; annotators align goals to video and motion, so the labels reflect experimental intentions
  rather than spontaneous self-reports.
intention_relevance: explicit
intention_definition: Two-person motion captured in staged home environments with time-aligned textual goals. Participants
  follow designed scenarios; annotators align goals to video and motion, so the labels reflect experimental intentions
  rather than spontaneous self-reports.
domains:
- daily_activities
- social_interaction
- embodied_interaction
intention_types:
- task_goal
- collaborative
tasks:
- goal_recognition
- trajectory_prediction
modalities:
- rgb
- depth
- pose
- text
data_formats:
- video
- time_series
- text
- structured_annotation
data_origin: real
annotations:
- id: intention
  semantic: intention
  description: Timestamped participant-specific intention text spanning long-term activities, short-term needs,
    environmental responses and partner interactions.
  provenance: experiment_assigned
  scope: Author-described dataset release
  source_ids:
  - official
  - paper
  - project
releases:
- id: original
  label: Original author-described release
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: No immutable annotation version was identified; benchmark protocols must resolve the precise files.
access:
  status: unavailable
  url: https://github.com/ummaaa/IntendToMove
  conditions: The official repository currently says data and code will be released soon. The public project and
    paper are accessible; a downloadable dataset was not found.
  checked_at: '2026-11-02'
  source_ids:
  - official
  - paper
  - project
licenses:
