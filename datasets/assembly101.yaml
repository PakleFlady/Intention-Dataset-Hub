schema_version: '0.1'
id: assembly101
name: Assembly101
year: 2022
description: Multi-view procedural assembly videos with annotated actions and anticipation tasks.
intention_relevance: implicit
intention_definition: Anticipate the next hand-object assembly action from a video prefix; action labels
  proxy the participant's immediate plan.
domains:
- daily_activities
- human_object_interaction
intention_types:
- object_interaction
tasks:
- action_anticipation
modalities:
- rgb
- pose
data_formats:
- video
- structured_annotation
data_origin: real
annotations:
- id: future_assembly_action
  semantic: future_action
  description: Subsequent annotated fine or coarse assembly action.
  provenance: behavior_derived
  scope: Assembly activity sequences
  source_ids:
  - official
releases:
- id: v1
  label: Assembly101 release documented by original source
  annotation_version: author-release-unspecified
  source_ids:
  - official
  notes: Exact annotation revision is not identified by this source.
access:
  status: open
  url: https://assembly-101.github.io/
  checked_at: '2026-09-30'
  source_ids:
  - project
  conditions: Official page says the data moved to Hugging Face in May 2026; individual files were not
    downloaded or tested.
licenses:
- component: Assembly101 dataset
  status: known
  name: CC BY-NC 4.0
  url: https://creativecommons.org/licenses/by-nc/4.0/
  source_ids:
  - project
sources:
- id: official
  type: paper
  title: Assembly101 original project or publication
  url: https://openaccess.thecvf.com/content/CVPR2022/html/Sener_Assembly101_A_Large-Scale_Multi-View_Video_Dataset_for_Understanding_Procedural_Activities_CVPR_2022_paper.html
  accessed_at: '2026-09-30'
  locator:
    section: Abstract; benchmark tasks
- id: project
  type: official_project
  title: Assembly101 official project and download page
  url: https://assembly-101.github.io/
  accessed_at: '2026-09-30'
  locator:
    section: News; License; Abstract
- id: example_source
  type: paper
  title: Assembly101 author-published example
  url: https://assembly-101.github.io/assets/Assembly101.pdf#page=2
  accessed_at: '2026-10-09'
  locator:
    section: Assembly101 paper, Figure 1, fine and coarse action timeline.
verification:
  status: verified
  checked_at: '2026-09-30'
  source_ids:
  - official
  - project
  notes: Original paper and current author project reviewed for task, scope, access entry and license;
    files not downloaded.
viewpoints:
- egocentric
- exocentric
capture_setup:
- fixed_camera
- wearable
- multi_camera

example:
  kind: source_figure
  input: Synchronized static and egocentric views of a participant assembling a take-apart toy vehicle in the sequence
    pictured in Figure 1.
  output: The author timeline includes the fine action label 'screw chassis with screwdriver' and the coarse label
    'screw chassis'. These are observed action annotations; the anticipation task predicts such labels before they
    begin.
  source_ids:
  - example_source
  sample_url: https://assembly-101.github.io/assets/Assembly101.pdf#page=2
  source_locator: Assembly101 paper, Figure 1, fine and coarse action timeline.
  media:
    kind: image
    url: https://assembly-101.github.io/assets/assembly101_rig.png
    alt: Official Assembly101 multi-camera capture rig around a toy assembly task
    caption: Author-published capture setup; the input is video from these cameras, not this still image.
  checked_at: '2026-10-09'
